name: ai-jenkins-devsecops

# Every published port is bound to 127.0.0.1: the stack is reachable from this machine only.
services:
  jenkins:
    build: ./jenkins
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:?copy .env.example to .env first}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?copy .env.example to .env first}
      AI_INGEST_TOKEN: ${AI_INGEST_TOKEN:?copy .env.example to .env first}
    volumes:
      - jenkins_home:/var/jenkins_home
      - agent_secret:/run/agent-secret
      - ./Jenkinsfile:/var/jenkins_config/Jenkinsfile:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/login"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  # Build executor. The controller has zero executors, and nothing mounts the Docker socket.
  agent:
    build:
      context: .
      dockerfile: jenkins/agent/Dockerfile
    depends_on:
      jenkins:
        condition: service_healthy
    environment:
      JENKINS_URL: http://jenkins:8080
      JENKINS_AGENT_NAME: build-agent
      JENKINS_AGENT_WORKDIR: /home/jenkins/agent
    volumes:
      - agent_secret:/run/agent-secret:ro
      - agent_work:/home/jenkins/agent
      # Source is mounted read-only, directory by directory. .env and .git are not visible.
      - ./app:/src/app:ro
      - ./ai:/src/ai:ro
      - ./ci:/src/ci:ro
      - ./scenarios:/src/scenarios:ro
      - ./terraform:/src/terraform:ro
      - ./requirements.txt:/src/requirements.txt:ro
      - ./requirements-dev.txt:/src/requirements-dev.txt:ro
      - ./pyproject.toml:/src/pyproject.toml:ro
    restart: unless-stopped

  app:
    build:
      context: .
      target: runtime
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    healthcheck: &python-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # AI analysis + human review UI. It gets no Jenkins URL and no Jenkins credentials.
  ai:
    build:
      context: .
      target: runtime
    command: ["uvicorn", "ai.service:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      AI_INGEST_TOKEN: ${AI_INGEST_TOKEN:?copy .env.example to .env first}
      AI_DATABASE_PATH: /data/review.db
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_FALLBACK_TO_MOCK: ${AI_FALLBACK_TO_MOCK:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
    volumes:
      - ai_data:/data
    read_only: true
    healthcheck: *python-health
    restart: unless-stopped

  # Unit tests in a container: docker compose --profile tools run --rm tests
  tests:
    profiles: ["tools"]
    build:
      context: .
      target: dev
    volumes:
      - ./:/work:ro
    network_mode: none

volumes:
  jenkins_home:
  agent_secret:
  agent_work:
  ai_data:
